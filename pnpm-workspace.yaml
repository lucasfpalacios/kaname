packages:
  - "apps/*"
  - "packages/*"

# Solo versiones publicadas hace al menos 1 día (1440 min). Declararlo lo vuelve estricto:
# pnpm frena en vez de agregar la versión a minimumReleaseAgeExclude. Ver AGENTS.md, regla 9.
minimumReleaseAge: 1440

allowBuilds:
  "@parcel/watcher": false
  "@prisma/engines": true
  "@swc/core": false
  esbuild: false
  prisma: false
  sharp: false
  unrs-resolver: false

# Lo que piden las dependencias además de los builds. @tanstack/react-table ofrece skills para
# agentes: no hacen falta para usarlo (ver docs/decisiones.md).
permissions:
  "@tanstack/react-table":
    skills: false
