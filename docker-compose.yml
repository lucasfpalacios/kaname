services:
  postgres:
    image: postgres:18.6-alpine
    container_name: kaname-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kaname
      POSTGRES_PASSWORD: kaname
      POSTGRES_DB: kaname
    ports:
      # Solo localhost: no exponer la base a la red local.
      - "127.0.0.1:5434:5432"
    volumes:
      # Postgres 18 guarda los datos en /var/lib/postgresql/18/docker: el volumen va en el padre.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaname -d kaname"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
