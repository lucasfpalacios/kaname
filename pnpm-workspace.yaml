packages:
  - "apps/*"
  - "packages/*"

# Solo versiones publicadas hace al menos 1 día (1440 min). Declararlo lo vuelve estricto:
# pnpm frena en vez de agregar la versión a minimumReleaseAgeExclude. Ver AGENTS.md, regla 9.
minimumReleaseAge: 1440

allowBuilds:
  "@parcel/watcher": false
  "@prisma/engines": true
  "@swc/core": false
  esbuild: false
  prisma: false
  sharp: false
  unrs-resolver: false

# Lo que piden las dependencias además de los builds. @tanstack/react-table ofrece skills para
# agentes: no hacen falta para usarlo (ver docs/decisiones.md).
permissions:
  "@tanstack/react-table":
    skills: false

# Versiones con parches de seguridad que todavía no piden las dependencias: @nestjs/platform-express
# fija multer 2.4.0, express acepta body-parser 2.3 (GHSA-q7qp-rjg7-q26m, GHSA-27r3-jxmh-p828),
# @prisma/dev trae fast-uri 3.1.x vieja por ajv y supertest (tests) trae qs 6.16.0
# (GHSA-6pq8-jhm2-2vcw). Sacarlas cuando las dependencias las traigan solas.
overrides:
  body-parser: 2.4.0
  fast-uri: 3.1.9
  multer: 2.5.0
  qs: 6.16.2
