<!DOCTYPE html><html lang="es"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Dark | Nexo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            kon: '#0F1A33',
            surface: '#1A2747',
            wasurenagusa: '#89C3EB',
            toki: '#F4B3C2',
            textlight: '#F3F1F6',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0F1A33;
      color: #F3F1F6;
    }
  </style>
</head>
<body class="min-h-screen bg-[#0F1A33] text-[#F3F1F6] flex flex-col justify-between relative selection:bg-[#89C3EB] selection:text-[#0F1A33] antialiased">
  <!-- Top Bar Controls -->
  <header class="w-full max-w-7xl mx-auto px-6 py-6 flex justify-between items-center z-10">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-[#89C3EB] flex items-center justify-center text-[#0F1A33] font-bold text-base shadow-sm">
        N
      </div>
      <span class="font-bold text-lg tracking-tight text-[#F3F1F6]">Nexo</span>
    </div>

    <!-- Top-Right Controls: Language Toggle & Light/Dark Toggle -->
    <div class="flex items-center gap-3">
      <!-- Language Toggle (ES/EN) -->
      <div class="flex items-center bg-[#1A2747] border border-[#2A3B63] rounded-lg p-0.5 shadow-xs">
        <button type="button" class="px-2.5 py-1 text-xs font-semibold rounded-md bg-[#89C3EB] text-[#0F1A33] transition-colors">
          ES
        </button>
        <button type="button" class="px-2.5 py-1 text-xs font-medium text-[#8F9BB3] hover:text-[#F3F1F6] transition-colors">
          EN
        </button>
      </div>

      <!-- Light/Dark Toggle (Dark active) -->
      <div class="flex items-center bg-[#1A2747] border border-[#2A3B63] rounded-lg p-0.5 shadow-xs">
        <button type="button" class="p-1.5 rounded-md text-[#8F9BB3] hover:text-[#F3F1F6] transition-colors" title="Cambiar a Modo Claro">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
          </svg>
        </button>
        <button type="button" class="p-1.5 rounded-md bg-[#89C3EB] text-[#0F1A33] shadow-xs" title="Modo Oscuro activo">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Centered Login Card -->
  <main class="flex-1 flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-[440px] bg-[#1A2747] rounded-2xl border border-[#26375E] shadow-[0_8px_32px_rgba(0,0,0,0.35)] p-8 sm:p-10">
      
      <!-- Wordmark and Subtitle -->
      <div class="text-center mb-8">
        <div class="inline-flex w-12 h-12 rounded-xl bg-[#89C3EB] items-center justify-center text-[#0F1A33] font-bold text-2xl shadow-sm mb-4">
          N
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-[#F3F1F6]">Nexo</h1>
        <p class="mt-1.5 text-sm text-[#94A3B8]">Plataforma de gestión multi-empresa</p>
      </div>

      <!-- Form -->
      <form class="space-y-5" onsubmit="event.preventDefault();">
        <!-- Email field -->
        <div>
          <label for="email_dark" class="block text-xs font-semibold uppercase tracking-wider text-[#CBD5E1] mb-1.5">
            Correo electrónico
          </label>
          <div class="relative">
            <input type="email" id="email_dark" name="email" placeholder="marcelo.gomez@distribuidoranorte.com.ar" value="lucas@plataforma.com.ar" class="w-full px-3.5 py-2.5 text-sm bg-[#121E38] border border-[#2B3D66] rounded-lg text-[#F3F1F6] placeholder-[#64748B] focus:outline-none focus:ring-2 focus:ring-[#89C3EB]/30 focus:border-[#89C3EB] transition-colors">
          </div>
        </div>

        <!-- Password field -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="password_dark" class="block text-xs font-semibold uppercase tracking-wider text-[#CBD5E1]">
              Contraseña
            </label>
            <a href="#" class="text-xs font-medium text-[#89C3EB] hover:underline focus:outline-none">
              ¿Olvidaste tu contraseña?
            </a>
          </div>
          <div class="relative">
            <input type="password" id="password_dark" name="password" placeholder="••••••••••••" value="contraseñasegura123" class="w-full px-3.5 py-2.5 pr-10 text-sm bg-[#121E38] border border-[#2B3D66] rounded-lg text-[#F3F1F6] placeholder-[#64748B] focus:outline-none focus:ring-2 focus:ring-[#89C3EB]/30 focus:border-[#89C3EB] transition-colors">
            <!-- Show/Hide password toggle icon -->
            <button type="button" id="togglePasswordDark" class="absolute inset-y-0 right-0 pr-3 flex items-center text-[#64748B] hover:text-[#CBD5E1] focus:outline-none" title="Mostrar/ocultar contraseña">
              <svg id="eyeIconDark" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember device option -->
        <div class="flex items-center">
          <input type="checkbox" id="remember_dark" checked="" class="w-4 h-4 text-[#89C3EB] bg-[#121E38] border-[#2B3D66] rounded focus:ring-[#89C3EB]">
          <label for="remember_dark" class="ml-2 text-xs text-[#94A3B8] select-none">
            Recordar este dispositivo
          </label>
        </div>

        <!-- Primary button -->
        <button type="submit" class="w-full py-2.5 px-4 bg-[#89C3EB] hover:bg-[#A3D1F0] active:bg-[#74B3DF] text-[#0F1A33] font-semibold text-sm rounded-lg transition-colors shadow-xs flex items-center justify-center gap-2">
          <span>Iniciar sesión</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
          </svg>
        </button>
      </form>

      <!-- Divider "o" -->
      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-[#2A3B63]"></div>
        </div>
        <div class="relative flex justify-center text-xs">
          <span class="px-3 bg-[#1A2747] text-[#64748B] uppercase font-medium">o</span>
        </div>
      </div>

      <!-- Secondary button "Continuar con Google" -->
      <button type="button" class="w-full py-2.5 px-4 bg-[#14203A] hover:bg-[#182645] active:bg-[#1E2E52] border border-[#2B3D66] text-[#F3F1F6] font-medium text-sm rounded-lg transition-colors shadow-2xs flex items-center justify-center gap-3">
        <svg class="w-4 h-4" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"></path>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"></path>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"></path>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"></path>
        </svg>
        <span>Continuar con Google</span>
      </button>

      <!-- Bottom link: "¿No tenés cuenta? Registrate" -->
      <div class="mt-6 text-center text-xs text-[#94A3B8]">
        ¿No tenés cuenta? 
        <a href="#" class="font-semibold text-[#89C3EB] hover:underline ml-1">
          Registrate
        </a>
      </div>
    </div>
  </main>

  <!-- Footer Info -->
  <footer class="w-full max-w-7xl mx-auto px-6 py-4 flex flex-col sm:flex-row items-center justify-between text-xs text-[#64748B] gap-2">
    <div>Nexo Enterprise v2.4 · Seguridad bancaria TLS 1.3</div>
    <div class="flex items-center gap-4">
      <a href="#" class="hover:text-[#94A3B8]">Términos de servicio</a>
      <span>·</span>
      <a href="#" class="hover:text-[#94A3B8]">Privacidad</a>
      <span>·</span>
      <a href="#" class="hover:text-[#94A3B8]">Ayuda</a>
    </div>
  </footer>

  <script>
    const toggleBtnDark = document.getElementById('togglePasswordDark');
    const pwdInputDark = document.getElementById('password_dark');
    if (toggleBtnDark && pwdInputDark) {
      toggleBtnDark.addEventListener('click', () => {
        const isPassword = pwdInputDark.type === 'password';
        pwdInputDark.type = isPassword ? 'text' : 'password';
      });
    }
  </script>


</body></html>
